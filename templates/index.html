<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>AGROVISION - Panel de Estado de Tomates</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .counter {
            background: white;
            padding: 15px;
            text-align: center;
            font-size: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .columns {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .column {
            background: white;
            padding: 15px;
            border-radius: 8px;
        }

        .column h2 {
            text-align: center;
            margin-top: 0;
        }

        ul {
            list-style: none;
            padding-left: 0;
        }

        li {
            background: #eee;
            margin: 5px 0;
            padding: 6px 10px;
            border-radius: 4px;
        }

        .maduro li {
            background: #ffd6d6;
        }

        .verde li {
            background: #d6ffd6;
        }

        .defectuoso li {
            background: #ffe4c4;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🍅 AGROVISION - Panel de Estado de Tomates 🍅</h1>

    <div class="counter">
        <strong>Total de detectados:</strong>
        <span id="total">0</span>
    </div>

    <div class="columns">
        <div class="column maduro">
            <h2>🍅 Maduro</h2>
            <ul id="maduro"></ul>
        </div>

        <div class="column verde">
            <h2>🟢 Verde</h2>
            <ul id="verde"></ul>
        </div>

        <div class="column defectuoso">
            <h2>⚠️ Defectuoso</h2>
            <ul id="defectuoso"></ul>
        </div>
    </div>
</div>

<script>
function actualizar() {
    fetch("/data")
        .then(response => response.json())
        .then(data => {
            document.getElementById("total").innerText = data.total;

            ["maduro", "verde", "defectuoso"].forEach(cat => {
                const ul = document.getElementById(cat);
                ul.innerHTML = "";

                data.historial[cat].forEach(id => {
                    const li = document.createElement("li");
                    li.innerText = "ID: " + id;
                    ul.appendChild(li);
                });
            });
        });
}

setInterval(actualizar, 1000);
</script>

</body>
</html>
